# Proxy TLS local de Restia (Actividad 3.2). Apache 2.4 de XAMPP con una configuración propia: no toca
# el httpd.conf de XAMPP. Lo arranca deploy/apache/iniciar.ps1, que define las variables de entorno:
#
#   APACHE_ROOT   carpeta de Apache (C:/xampp/apache)
#   RESTIA_DEPLOY esta carpeta (deploy/apache), con certs/restia.crt y certs/restia.key
#   RESTIA_WEB    carpeta dist/ del panel (restia-web, `npm run build`)
#
# https://localhost:8443/          panel web (archivos estáticos)
# https://localhost:8443/api/...   API Laravel en http://127.0.0.1:8000 (php artisan serve)
# http://localhost:8080/...        redirige a HTTPS con 301

ServerRoot "${APACHE_ROOT}"
ServerName localhost
PidFile "${RESTIA_DEPLOY}/logs/httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

TypesConfig conf/mime.types
ErrorLog "${RESTIA_DEPLOY}/logs/error.log"
LogLevel warn
LogFormat "%h %t \"%r\" %>s %b %{SSL_PROTOCOL}x %{SSL_CIPHER}x" tls
# Sin cuerpo, sin cookies ni cabeceras de autorización en el log de acceso.
CustomLog "${RESTIA_DEPLOY}/logs/access.log" tls

# No anunciar versión de Apache ni del sistema.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen 8080
Listen 8443

# --- HTTP: solo redirige a HTTPS ------------------------------------------------------------------
<VirtualHost *:8080>
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}:8443/$1 [R=301,L]
</VirtualHost>

# --- HTTPS: TLS 1.2 y 1.3 únicamente --------------------------------------------------------------
SSLSessionCache "shmcb:${RESTIA_DEPLOY}/logs/ssl_scache(512000)"
SSLRandomSeed startup builtin

<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile "${RESTIA_DEPLOY}/certs/restia.crt"
    SSLCertificateKeyFile "${RESTIA_DEPLOY}/certs/restia.key"

    # SSLv2, SSLv3, TLS 1.0 y TLS 1.1 deshabilitados explícitamente.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # TLS 1.2: solo intercambio ECDHE (secreto perfecto hacia adelante) y cifrado AEAD.
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder off
    SSLCompression off
    SSLSessionTickets off

    # La API pone sus propias cabeceras de seguridad (SecurityHeaders); aquí solo se oculta la versión de PHP.
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # API y cookie CSRF: a Laravel, avisando que el cliente llegó por HTTPS.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8443"
    ProxyPreserveHost On
    ProxyPass        /api/            http://127.0.0.1:8000/api/
    ProxyPassReverse /api/            http://127.0.0.1:8000/api/
    ProxyPass        /sanctum/        http://127.0.0.1:8000/sanctum/
    ProxyPassReverse /sanctum/        http://127.0.0.1:8000/sanctum/
    ProxyPass        /up              http://127.0.0.1:8000/up
    ProxyPass        /contrasena      http://127.0.0.1:8000/contrasena

    # Panel web: archivos estáticos; toda ruta desconocida vuelve a index.html (enrutador de Vue).
    DocumentRoot "${RESTIA_WEB}"
    DirectoryIndex index.html
    <Directory "${RESTIA_WEB}">
        Require all granted
        Options -Indexes
        AllowOverride None

        # Cabeceras de seguridad del panel (las mismas que restia-web/security-headers.js).
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
        # CSP: solo recursos propios; sin scripts ni estilos en línea y sin marcos.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
