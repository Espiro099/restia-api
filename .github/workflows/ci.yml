name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contrato:
    name: Pruebas del contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q tests/contract
      - name: El catálogo de errores de PHP coincide con el contrato
        run: |
          python tools/gen_matrices.py > /dev/null
          python tools/gen_error_catalog.py
          git diff --exit-code -- docs tests/contract config/errors.php

  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs-restia
    steps:
      - uses: actions/checkout@v4
      - name: MongoDB como replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rs-restia
          mongodb-port: 27018
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: vendor/bin/pint --test
      - run: php artisan test
