# Ambiente de PRUEBAS de Restia en Render (docs/Despliegue_Staging.md). No es producción:
# APP_ENV=staging y PAC simulado. Los correos (enlaces de contraseña) salen por Resend.
# Plan gratuito: el servicio se duerme sin uso. No hay worker (son de pago): el programador de tareas corre en el
# mismo contenedor (RESTIA_RUN_SCHEDULER=true, docker/start.sh) mientras el servicio está despierto. Con un plan de
# pago, cambia `plan` a starter, quita el comentario del worker y pon RESTIA_RUN_SCHEDULER en false.
# Los valores con `sync: false` son secretos: Render los pide al crear el Blueprint y nunca van en el repo.
services:
  - type: web
    name: restia-api-staging
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - fromGroup: restia-staging
      - key: PORT
        value: "8080"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESTIA_REFRESH_KEY
        sync: false
      # Correo con Resend (MAIL_MAILER=resend en el grupo): clave de API y remitente de un dominio verificado.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Asistentes del menú QR (QR-14) y del sitio de La Mesa (SITE-3): llave de la API de Claude. Sin ella no se ofrecen.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Inicio de sesión con Google (Decisiones_Google_Login): ID de cliente OAuth Web. Vacío, está apagado.
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Impresión, avisos, inventario, reportes, reservaciones y facturación avanzan aquí (routes/console.php).
  # - type: worker
  #   name: restia-tareas-staging
  #   runtime: docker
  #   plan: starter
  #   branch: main
  #   autoDeploy: true
  #   dockerCommand: php artisan schedule:work
  #   envVars:
  #     - fromGroup: restia-staging
  #     - key: APP_URL
  #       sync: false
  #     - key: APP_KEY
  #       sync: false
  #     - key: MONGODB_URI
  #       sync: false

envVarGroups:
  - name: restia-staging
    envVars:
      - key: APP_NAME
        value: Restia
      # No "production": así siguen disponibles restia:demo y el PAC simulado.
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_DATABASE
        value: Restia
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # API HTTP de Resend (app/Mail/ResendTransport.php): el plan gratuito de Render bloquea SMTP.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_NAME
        value: Restia
      - key: BCRYPT_ROUNDS
        value: "12"
      # Render termina el TLS en su proxy, cuyas direcciones no son fijas; el contenedor no es alcanzable directo.
      - key: RESTIA_FORCE_HTTPS
        value: "true"
      - key: RESTIA_TRUSTED_PROXIES
        value: "*"
      - key: RESTIA_PAC
        value: simulated
      # El panel web publicado (restia-web, render.yaml) reenvía /api y /sanctum a esta API: mismo origen.
      - key: RESTIA_CORS_ORIGINS
        value: https://restia-web-staging.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: restia-web-staging.onrender.com
      # Enlaces de contraseña y QR de las mesas llevan al panel (que reenvía /contrasena a esta API).
      - key: RESTIA_WEB_URL
        value: https://restia-web-staging.onrender.com
      - key: RESTIA_PUBLIC_URL
        value: https://restia-web-staging.onrender.com
      - key: RESTIA_RUN_SCHEDULER
        value: "true"
